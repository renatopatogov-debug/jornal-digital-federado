global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "alert_rules.yml"

scrape_configs:
  - job_name: "jornal_backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8080"]
        labels:
          environment: "production"
          service: "jornal-digital-federado-api"

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
