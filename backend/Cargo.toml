[package]
name = "jornal_backend"
version = "0.1.0"
edition = "2021"
authors = ["Diretoria de Tecnologia e Seguranca <superadmin@jornalfederado.org.br>"]
description = "Core API Axum do Jornal Digital Federado (Plano Diretor v2.1)"

[dependencies]
# Web Framework & Async Runtime
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.37", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full", "set-header"] }

# Banco de Dados & Cache
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Serialização & Tipagem
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Segurança, Criptografia & Sanitização (ADR D8)
ammonia = "4.0" # Sanitizador HTML estrito anti-XSS
argon2 = "0.5" # Hash de senhas m=65536, t=3, p=4
aes-gcm = "0.10" # Envelope 2FA TOTP AES-256-GCM
totp-rs = { version = "5.5", features = ["qr", "gen_secret"] }
webauthn-rs = { version = "0.5", default-features = false, features = ["danger-allow-state-serialisation"] }
sha2 = "0.10"
base64 = "0.22"

# Logging & Telemetria
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "1.0"
anyhow = "1.0"
rand = "0.8"
